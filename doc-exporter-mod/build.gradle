plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.62-beta'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = 'Forge'
        url = "https://maven.minecraftforge.net"
    }
    maven {
        name = "OctoStudios"
        url = uri("https://maven.octo-studios.com/releases")
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    webpRuntimeLibraries
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // ModDevGradle does not put JarJar-only libraries on the dev-launch runtime classpath.
            // Add the WebP encoder stack explicitly for runClient/runtime validation.
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.webpRuntimeLibraries)
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    var patchless_mc_version = project.minecraft_version.count('.') != 2 ? project.minecraft_version : project.minecraft_version.replaceFirst("\\.\\d*\$", "")
    var jarJarLibrary = { String notation, String depVersion ->
        jarJar(implementation(notation)) {
            version {
                strictly "[${depVersion}]"
                prefer depVersion
            }
        }
    }

    implementation "com.hollingsworth.ars_nouveau:ars_nouveau-${project.minecraft_version}:${project.ars_version}"
    implementation "org.appliedenergistics:guideme:${project.guideme_version}"

    // The GuideME-derived animated WebP exporter uses JavaCPP FFmpeg. Bundle the Java API plus the platforms used by
    // local development (macOS arm64) and CI/export runs (Linux x86_64).
    jarJarLibrary("org.bytedeco:javacpp:${project.javacpp_version}", project.javacpp_version)
    jarJarLibrary("org.bytedeco:javacpp:${project.javacpp_version}:linux-x86_64", project.javacpp_version)
    jarJarLibrary("org.bytedeco:javacpp:${project.javacpp_version}:macosx-arm64", project.javacpp_version)
    jarJarLibrary("org.bytedeco:ffmpeg:${project.ffmpeg_version}", project.ffmpeg_version)
    jarJarLibrary("org.bytedeco:ffmpeg:${project.ffmpeg_version}:linux-x86_64", project.ffmpeg_version)
    jarJarLibrary("org.bytedeco:ffmpeg:${project.ffmpeg_version}:macosx-arm64", project.ffmpeg_version)

    webpRuntimeLibraries "org.bytedeco:javacpp:${project.javacpp_version}"
    webpRuntimeLibraries "org.bytedeco:javacpp:${project.javacpp_version}:linux-x86_64"
    webpRuntimeLibraries "org.bytedeco:javacpp:${project.javacpp_version}:macosx-arm64"
    webpRuntimeLibraries "org.bytedeco:ffmpeg:${project.ffmpeg_version}"
    webpRuntimeLibraries "org.bytedeco:ffmpeg:${project.ffmpeg_version}:linux-x86_64"
    webpRuntimeLibraries "org.bytedeco:ffmpeg:${project.ffmpeg_version}:macosx-arm64"

    compileOnly "software.bernie.geckolib:geckolib-neoforge-${project.minecraft_version}:${project.gecko_version}"
    compileOnly "com.hollingsworth.nuggets:nuggets-neoforge-${patchless_mc_version}:${project.nuggets_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}+${patchless_mc_version}"
    runtimeOnly files("libs/mc-runtime-test-1.21.1-3.1.1-neoforge-release.jar")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version                     : minecraft_version,
                             minecraft_version_range               : minecraft_version_range,
                             neo_version                           : neo_version,
                             neo_version_range                     : neo_version_range,
                             loader_version_range                  : loader_version_range,
                             mod_id                                : mod_id,
                             mod_name                              : mod_name,
                             mod_license                           : mod_license,
                             mod_version                           : mod_version,
                             mod_authors                           : mod_authors,
                             mod_description                       : mod_description]

    var props = new Properties()
    file(GRADLE_PROPERTIES).withInputStream { props.load(it) }
    for (var p : props) {
        if (p.key instanceof String && p.value instanceof String) {
            var k = (String) p.key
            var v = (String) p.value
            if (k.endsWith("_version_range")) {
                replaceProperties.put(k, v)
            }
        }
    }

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

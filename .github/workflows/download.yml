name: Download and Export

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

env:
  JAVA_VERSION: 21

permissions:
  contents: write
  actions: write

jobs:
  build-doc-exporter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./doc-exporter-mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute content tree hash for doc-exporter-mod
        id: exporter_hash
        shell: bash
        run: |
          set -e
          HASH=$(git rev-parse HEAD:doc-exporter-mod || true)
          if [ -z "$HASH" ]; then
            HASH=$(git rev-parse HEAD)
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore exporter jar cache
        id: exporter_cache
        uses: actions/cache/restore@v4
        with:
          path: doc-exporter-mod/build/libs/
          key: doc-exporter-jar-${{ steps.exporter_hash.outputs.hash }}

      - name: Setup Java
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Create gradle cache for assets
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.gradle/caches/fabric-loom/assets

      - name: Setup Gradle
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-overwrite-existing: true

      - name: Build doc-exporter mod
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        run: ./gradlew build

      - name: Save exporter jar to cache
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: doc-exporter-mod/build/libs/
          key: doc-exporter-jar-${{ steps.exporter_hash.outputs.hash }}

      - name: Upload exporter jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-exporter-jar
          path: doc-exporter-mod/build/libs/*.jar

  find:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.MATRIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - id: filter
        run: |
          MATRIX=$(jq -n -c '[inputs | select((.disabled // false) | not) | select(.cf_id) | input_filename]' projects/*.json)
          echo "MATRIX=$MATRIX" >> "$GITHUB_OUTPUT"

  download:
    runs-on: ubuntu-latest
    needs: [find]
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.find.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project name
        id: info
        run: echo "name=$(basename ${{ matrix.file }} .json)" >> "$GITHUB_OUTPUT"

      - name: Download mod JAR from CurseForge
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 scripts/download_cf.py "${{ matrix.file }}"

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.name }}-jar
          path: mods/*.jar

  run-and-export:
    runs-on: ubuntu-latest
    needs: [build-doc-exporter, download]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mods folder
        run: mkdir -p run/mods

      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          path: run/mods
          pattern: "*-jar"
          merge-multiple: true

      - name: Remove old output
        run: rm -rf output/*

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Export docs using headless client
        uses: headlesshq/mc-runtime-test@3.1.1
        with:
          mc: 1.21.1
          modloader: neoforge
          regex: .*neoforge.*
          mc-runtime-test: neoforge
          java: ${{ env.JAVA_VERSION }}
          xvfb: true

      - name: Build tomes.json
        run: python3 scripts/build_tomes.py output output/manifests/tomes.json

      - name: Move glyphs.json
        run: |
          mkdir -p output/manifests
          mv output/glyphs.json output/manifests/glyphs.json

      - name: Build book.json
        run: python3 scripts/build_book.py output output/manifests/book.json

      - name: Build render.json
        run: python3 scripts/build_render_manifest.py output output/manifests/render.json

      - name: Build tags.json
        run: python3 scripts/build_tags_manifest.py output output/manifests/tags.json

      - name: Build lang.json
        run: python3 scripts/build_lang_manifest.py output output/manifests/lang.json

      - name: Build recipes.json
        run: python3 scripts/build_recipes.py output output/manifests/recipes.json

      - name: Copy project configs
        run: cp -R projects output/projects

      - name: Build projects.json
        run: python3 scripts/build_project_manifest.py output output/manifests/projects.json

      - name: Build manifest.json
        run: python3 scripts/build_manifest.py output output/manifest.json

      - name: Optimize PNGs
        run: |
          curl -LO https://github.com/oxipng/oxipng/releases/download/v10.1.1/oxipng-10.1.1-x86_64-unknown-linux-gnu.tar.gz
          tar -xvzf oxipng-10.1.1-x86_64-unknown-linux-gnu.tar.gz
          oxipng-10.1.1-x86_64-unknown-linux-gnu/oxipng --fast -s $(find -name '*.png')
          rm -rf oxipng-10.1.1-x86_64-unknown-linux-gnu

      - name: Sync output to R2
        run: aws s3 sync output/ s3://ars-guide-assets --delete --size-only --no-progress --only-show-errors --endpoint-url https://fb2e8a157cc36da2700bf6655622bf89.r2.cloudflarestorage.com
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Compute release hash
        id: release_hash
        shell: bash
        run: |
          echo "hash=$(git rev-parse --short HEAD || true)" >> "$GITHUB_OUTPUT"

      - name: Publish doc-exporter
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_hash.outputs.hash }}
          files: run/mods/doc-exporter-*.jar

  retry-on-failure:
    if: failure() && fromJSON(github.run_attempt) < 3
    needs: [run-and-export]
    runs-on: ubuntu-latest
    steps:
      - uses: Jarva/job-id@60a3ded3f9a9371a3c9e127d247838f4a9b843d7
        id: job-id
        with:
          job-name: run-and-export
          github-token: ${{ github.token }}
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }} job_id=${{ steps.job-id.outputs.job-id }}

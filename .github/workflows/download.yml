name: Download and Export

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

env:
  JAVA_VERSION: 21

permissions:
  contents: write
  actions: write

jobs:
  build-doc-exporter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./doc-exporter-mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute content tree hash for doc-exporter-mod
        id: exporter_hash
        shell: bash
        run: |
          set -e
          HASH=$(git rev-parse HEAD:doc-exporter-mod || true)
          if [ -z "$HASH" ]; then
            HASH=$(git rev-parse HEAD)
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore exporter jar cache
        id: exporter_cache
        uses: actions/cache/restore@v4
        with:
          path: doc-exporter-mod/build/libs/
          key: doc-exporter-jar-${{ steps.exporter_hash.outputs.hash }}

      - name: Setup Java
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Create gradle cache for assets
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.gradle/caches/fabric-loom/assets

      - name: Setup Gradle
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-overwrite-existing: true

      - name: Build doc-exporter mod
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        run: ./gradlew build

      - name: Save exporter jar to cache
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: doc-exporter-mod/build/libs/
          key: doc-exporter-jar-${{ steps.exporter_hash.outputs.hash }}

      - name: Upload exporter jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-exporter-jar
          path: doc-exporter-mod/build/libs/*.jar

  find:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.MATRIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - id: filter
        run: |
          MATRIX=$(jq -n -c '[inputs | select((.disabled // false) | not) | select(.cf_id) | {file: input_filename, cf_id: .cf_id, name: (input_filename | ltrimstr("projects/") | rtrimstr(".json")), dependencies: (.dependencies // [])}]' projects/*.json)
          echo "MATRIX=$MATRIX" >> "$GITHUB_OUTPUT"

  download:
    runs-on: ubuntu-latest
    needs: [find]
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.find.outputs.matrix) }}
    steps:
      - name: Download mod JAR from CurseForge
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mods

          download_cf_file() {
            local mod_id="$1"
            local label="$2"

            # Query for latest file matching game version and NeoForge loader
            local response
            response=$(curl -sf -H "x-api-key: $CF_API_KEY" \
              "https://api.curseforge.com/v1/mods/${mod_id}/files?gameVersion=1.21.1&modLoaderType=6&pageSize=1")

            local file_id filename download_url
            file_id=$(echo "$response" | jq -r '.data[0].id')
            filename=$(echo "$response" | jq -r '.data[0].fileName')
            download_url=$(echo "$response" | jq -r '.data[0].downloadUrl')

            if [ "$file_id" = "null" ] || [ -z "$file_id" ]; then
              echo "::warning::No file found for ${label} (mod ID ${mod_id})"
              return 1
            fi

            echo "Downloading ${label}: ${filename} (file ID ${file_id})"

            # Handle null downloadUrl (author has disabled direct downloads)
            if [ "$download_url" = "null" ] || [ -z "$download_url" ]; then
              local id_high=$((file_id / 1000))
              local id_low=$((file_id % 1000))
              download_url="https://edge.forgecdn.net/files/${id_high}/${id_low}/${filename}"
              echo "Using fallback URL: ${download_url}"
            fi

            curl -sfL -o "mods/${filename}" "$download_url"
            echo "Downloaded ${filename}"
          }

          # Download the main mod
          download_cf_file "${{ matrix.project.cf_id }}" "${{ matrix.project.name }}"

          # Download dependencies
          DEPS='${{ toJson(matrix.project.dependencies) }}'
          DEP_COUNT=$(echo "$DEPS" | jq 'length')
          for i in $(seq 0 $((DEP_COUNT - 1))); do
            dep_id=$(echo "$DEPS" | jq -r ".[$i].cf_id")
            dep_name=$(echo "$DEPS" | jq -r ".[$i].name")
            download_cf_file "$dep_id" "$dep_name" || true
          done

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-jar
          path: mods/*.jar

  run-and-export:
    runs-on: ubuntu-latest
    needs: [build-doc-exporter, download]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mods folder
        run: mkdir -p run/mods

      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          path: run/mods
          pattern: "*-jar"
          merge-multiple: true

      - name: Remove sources files
        run: rm run/mods/*-sources.jar || true

      - name: List mods files
        id: list_mods
        shell: bash
        run: |
          set -e
          FILES=$(find run/mods -maxdepth 1 -type f -printf 'run/mods/%f\n' | sort || true)
          {
            echo "files<<__MODS__"
            printf '%s\n' "$FILES"
            echo "__MODS__"
          } >> "$GITHUB_OUTPUT"

      - name: Remove old output
        run: rm -rf output/wiki output/lang output/renders output/tags

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Export docs using headless client
        uses: headlesshq/mc-runtime-test@3.1.1
        with:
          mc: 1.21.1
          modloader: neoforge
          regex: .*neoforge.*
          mc-runtime-test: neoforge
          java: ${{ env.JAVA_VERSION }}
          xvfb: true

      - name: Commit and push updated runtime resources
        uses: Jarva/git-commit-push@main
        with:
          pull: true
          commit_message: "feat: update runtime resources"

      - name: Compute release hash
        id: release_hash
        shell: bash
        run: |
          echo "hash=$(git rev-parse --short HEAD || true)" >> "$GITHUB_OUTPUT"

      - name: Publish Jars
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_hash.outputs.hash }}
          files: ${{ steps.list_mods.outputs.files }}

  retry-on-failure:
    if: failure() && fromJSON(github.run_attempt) < 3
    needs: [run-and-export]
    runs-on: ubuntu-latest
    steps:
      - uses: Jarva/job-id@60a3ded3f9a9371a3c9e127d247838f4a9b843d7
        id: job-id
        with:
          job-name: run-and-export
          github-token: ${{ github.token }}
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }} job_id=${{ steps.job-id.outputs.job-id }}

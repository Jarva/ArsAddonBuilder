name: Build Repositories

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/**'
  schedule:
    - cron: "0 0 * * *"

env:
  JAVA_VERSION: 21

permissions:
  contents: write

jobs:
  build-doc-exporter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./doc-exporter-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - shell: bash
        run: |
          mkdir -p ~/.gradle/caches/fabric-loom/assets
      - uses: gradle/actions/setup-gradle@v3
      - name: Build mod
        run: |
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: doc-exporter-jar
          path: doc-exporter-mod/build/libs/*.jar
  sync:
    name: 'Submodules Sync'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ["1.21"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
    - name: Sync Projects
      run: |
        ./scripts/sync.sh
    - uses: Jarva/git-commit-push@main
      with:
        pull: true
        commit_message: "ci: bump versions"
  find:
    runs-on: ubuntu-latest
    needs: [sync]
    outputs:
      matrix: ${{ steps.filter.outputs.MATRIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: filter
        run: |
          echo "MATRIX=$(ls projects | sed -E 's/(^|$)/"/g' | jq -cs 'map("projects/\(.)")')" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: [find]
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.find.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: info
        run: |
          echo "MODULE=$(jq -c . < ${{ matrix.file }})" >> $GITHUB_OUTPUT
          echo "DIR=$(basename ${{ matrix.file }} .json)" >> $GITHUB_OUTPUT
      - run: |
          mkdir -p build/${{ steps.info.outputs.DIR }}
      - uses: actions/checkout@v4
        name: Checkout module
        with:
          repository: ${{ fromJson(steps.info.outputs.MODULE).repo }}
          ref: ${{ fromJson(steps.info.outputs.MODULE).branch }}
          path: build/${{ steps.info.outputs.DIR }}
      - name: Setup gradle
        shell: bash
        env:
          DIRECTORY: build/${{ steps.info.outputs.DIR }}
        run: |
          chmod +x $DIRECTORY/gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - shell: bash
        run: |
          mkdir -p ~/.gradle/caches/fabric-loom/assets
      - uses: gradle/actions/setup-gradle@v3
      - name: Build project
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          attempt_delay: 2000
          current_path: build/${{ steps.info.outputs.DIR }}
          command: ./gradlew runData build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.DIR }}-jar
          path: build/${{ steps.info.outputs.DIR }}/build/libs/*.jar
      - name: Mark Resources Outdated
        if: failure()
        shell: bash
        run: |
          mkdir -p output/resources/${{ steps.info.outputs.DIR }}
          echo ${{ fromJson(steps.info.outputs.MODULE).hash }} > output/resources/${{ steps.info.outputs.DIR }}/.outdated
      - name: Action - rsync data and resources
        if: success()
        uses: up9cloud/action-rsync@v1.4
        env:
          MODE: local
          SOURCE: "build/${{ steps.info.outputs.DIR }}/src/main/resources/ build/${{ steps.info.outputs.DIR }}/src/generated/resources/"
          TARGET: output/resources/${{ steps.info.outputs.DIR }}
          VERBOSE: true
          PRE_SCRIPT: |
            rm -rf output/resources/${{ steps.info.outputs.DIR }}
            echo start at:
            date -u
          POST_SCRIPT: "echo done at: && date -u"
      - name: Create Patch and Commit Message if changed
        shell: bash
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          COMMIT_MSG="feat: update ${{ matrix.file }} to ${{ fromJson(steps.info.outputs.MODULE).hash }}"
          git diff > build/${{ steps.info.outputs.DIR }}.patch || true
          PATCH_SIZE=$(stat -c%s "build/${{ steps.info.outputs.DIR }}.patch" || echo 0)
          if [[ "$PATCH_SIZE" -eq "0" ]]; then
            echo "No changes to save as patch."
            rm build/${{ steps.info.outputs.DIR }}.patch
          else
            echo "$COMMIT_MSG" > build/${{ steps.info.outputs.DIR }}.msg
          fi
      - uses: actions/upload-artifact@v4
        if: exists('build/${{ steps.info.outputs.DIR }}.patch')
        with:
          name: patch-${{ steps.info.outputs.DIR }}
          path: |
            build/${{ steps.info.outputs.DIR }}.patch
            build/${{ steps.info.outputs.DIR }}.msg
  apply-patches:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all patch artifacts
        uses: actions/download-artifact@v4
        with:
          path: patches
          pattern: patch-*

      - name: List patches
        id: list_patches
        run: |
          find patches -name "*.patch" -type f | sort > patches/patch_list.txt

      - name: Apply patches and commit individually
        run: |
          set -e
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          PATCH_COUNT=0
          while IFS= read -r patchfile; do
            if [ ! -s "$patchfile" ]; then continue; fi
            msgfile="${patchfile%.patch}.msg"
            if [ ! -s "$msgfile" ]; then
              echo "Patch $patchfile missing message file $msgfile, skipping."
              continue
            fi
            echo "Applying $patchfile"
            git apply "$patchfile"
            git add .
            COMMIT_MSG=$(cat "$msgfile")
            git commit -m "$COMMIT_MSG"
            PATCH_COUNT=$((PATCH_COUNT+1))
          done < patches/patch_list.txt
          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "No patches to commit."
            exit 0
          fi
          git pull --rebase
          git push

  run-and-export:
    runs-on: ubuntu-latest
    needs: [build-doc-exporter, apply-patches]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create mods folder
        run: |
          mkdir -p run/mods
      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          path: run/mods
          pattern: '*-jar'
          merge-multiple: true
      - name: Download dependencies
        run: |
          cd run/mods
          cat ../../dependencies.json | jq -r 'keys[] as $key | .[$key]' | while read -r dependency; do curl -LO "$dependency"; done
          rm *-sources.jar
      - name: Remove old wiki
        run: |
          rm -rf output/wiki/*
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Export docs using headless client
        uses: headlesshq/mc-runtime-test@3.0.0
        with:
          mc: 1.21.1
          modloader: neoforge
          regex: .*neoforge.*
          mc-runtime-test: neoforge
          java: ${{ env.JAVA_VERSION }}
          xvfb: false
      - uses: Jarva/git-commit-push@main
        if: success() || failure()
        with:
          pull: true
          commit_message: "feat: update runtime resources"

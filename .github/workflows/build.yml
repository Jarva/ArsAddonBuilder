name: Build Repositories

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/**'

env:
  JAVA_VERSION: 21
  CURIOS_URL: https://maven.theillusivec4.top/top/theillusivec4/curios/curios-neoforge/9.3.1+1.21.1/curios-neoforge-9.3.1+1.21.1.jar
  PATCHOULI_URL: https://github.com/VazkiiMods/Patchouli/releases/download/release-1.21-88/Patchouli-1.21-88-NEOFORGE.jar
  GECKOLIB_URL: https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-neoforge-1.21.1/4.7.4.1/geckolib-neoforge-1.21.1-4.7.4.1.jar

permissions:
  contents: write

jobs:
  build-doc-exporter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./doc-exporter-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            doc-exporter-mod/*.gradle*
            doc-exporter-mod/**/gradle-wrapper.properties
      - shell: bash
        run: |
          mkdir -p ~/.gradle/caches/fabric-loom/assets
      - uses: gradle/actions/setup-gradle@v3
      - name: Build mod
        run: |
          ./gradlew clean build
      - uses: actions/upload-artifact@v4
        with:
          name: doc-exporter-jar
          path: doc-exporter-mod/build/libs/*.jar
  find:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      matrix: ${{ steps.filter.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: json
          base: ${{ github.ref }}
          filters: |
            changed:
              - 'projects/*.json'
  build:
    runs-on: ubuntu-latest
    needs: [build-doc-exporter, find]
    if: ${{ needs.find.outputs.changed != 'deadbeef' }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.find.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: info
        run: |
          echo "MODULE=$(jq -c . < ${{ matrix.file }})" >> $GITHUB_OUTPUT
          echo "DIR=$(basename ${{ matrix.file }} .json)" >> $GITHUB_OUTPUT
      - run: |
          mkdir -p build/${{ steps.info.outputs.DIR }}
      - uses: actions/checkout@v4
        name: Checkout module
        with:
          repository: ${{ fromJson(steps.info.outputs.MODULE).repo }}
          ref: ${{ fromJson(steps.info.outputs.MODULE).branch }}
          path: build/${{ steps.info.outputs.DIR }}
      - name: Setup gradle
        shell: bash
        env:
          DIRECTORY: build/${{ steps.info.outputs.DIR }}
        run: |
          chmod +x $DIRECTORY/gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            build/${{ steps.info.outputs.DIR }}/*.gradle*
            build/${{ steps.info.outputs.DIR }}/**/gradle-wrapper.properties
      - shell: bash
        run: |
          mkdir -p ~/.gradle/caches/fabric-loom/assets
      - uses: gradle/actions/setup-gradle@v3
      - name: retry action
        uses: Wandalen/wretry.action@v3.5.0
        with:
          attempt_limit: 3
          attempt_delay: 2000
          current_path: build/${{ steps.info.outputs.DIR }}
          command: ./gradlew clean runData build
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ steps.info.outputs.DIR }}-jar
          path: build/${{ steps.info.outputs.DIR }}/build/libs/*.jar
      - name: Mark Resources Outdated
        if: failure()
        shell: bash
        run: |
          mkdir -p resources/${{ steps.info.outputs.DIR }}
          echo ${{ fromJson(steps.info.outputs.MODULE).hash }} > resources/${{ steps.info.outputs.DIR }}/.outdated
      - name: Action - rsync data and resources
        if: success()
        uses: up9cloud/action-rsync@v1.4
        env:
          MODE: local
          SOURCE: "build/${{ steps.info.outputs.DIR }}/src/main/resources/ build/${{ steps.info.outputs.DIR }}/src/generated/"
          TARGET: resources/${{ steps.info.outputs.DIR }}
          VERBOSE: true
          PRE_SCRIPT: |
            rm -rf resources/${{ steps.info.outputs.DIR }}
            echo start at:
            date -u
          POST_SCRIPT: "echo done at: && date -u"
      - uses: Jarva/git-commit-push@main
        if: success() || failure()
        with:
          pull: true
          commit_message: "feat: update ${{ matrix.file }} to ${{ fromJson(steps.info.outputs.MODULE).hash }}"
  export-wiki:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create mods folder
        run: |
          mkdir -p run/mods
      - name: Download dependencies
        run: |
          cd run/mods
          curl -LO "${{ env.CURIOS_URL }}"
          curl -LO "${{ env.PATCHOULI_URL }}"
          curl -LO "${{ env.GECKOLIB_URL }}"
      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          path: run/mods
          pattern: '*-jar'
          merge-multiple: true
      - name: Remove old wiki
        run: |
          rm -rf wiki/*
      - name: Export docs using headless client
        uses: headlesshq/mc-runtime-test@3.0.0
        with:
          mc: 1.21.1
          modloader: neoforge
          regex: .*neoforge.*
          mc-runtime-test: neoforge
          java: ${{ env.JAVA_VERSION }}
      - uses: Jarva/git-commit-push@main
        if: success() || failure()
        with:
          pull: true
          commit_message: "feat: update wiki"

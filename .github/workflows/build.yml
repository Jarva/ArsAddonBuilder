name: Build Updated Projects

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/**'

env:
  JAVA_VERSION: 21

permissions:
  contents: write

jobs:

  build-doc-exporter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./doc-exporter-mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute content tree hash for doc-exporter-mod
        id: exporter_hash
        shell: bash
        run: |
          set -e
          HASH=$(git rev-parse HEAD:doc-exporter-mod || true)
          if [ -z "$HASH" ]; then
            HASH=$(git rev-parse HEAD)
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore exporter jar cache
        id: exporter_cache
        uses: actions/cache/restore@v4
        with:
          path: doc-exporter-mod/build/libs/
          key: doc-exporter-jar-${{ steps.exporter_hash.outputs.hash }}

      - name: Setup Java
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Create gradle cache for assets
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.gradle/caches/fabric-loom/assets

      - name: Setup Gradle
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-overwrite-existing: true

      - name: Build doc-exporter mod
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        run: ./gradlew build

      - name: Save exporter jar to cache
        if: steps.exporter_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: doc-exporter-mod/build/libs/
          key: doc-exporter-jar-${{ steps.exporter_hash.outputs.hash }}

      - name: Upload exporter jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-exporter-jar
          path: doc-exporter-mod/build/libs/*.jar

  find:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.MATRIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - id: filter
        run: |
          echo "MATRIX=$(ls projects | sed -E 's/(^|$)/"/g' | jq -cs 'map("projects/\(.)")')" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: [find]
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.find.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: info
        run: |
          echo "MODULE=$(jq -c . < ${{ matrix.file }})" >> $GITHUB_OUTPUT
          echo "DIR=$(basename ${{ matrix.file }} .json)" >> $GITHUB_OUTPUT

      - name: Prepare build directory
        run: |
          mkdir -p build/${{ steps.info.outputs.DIR }}

      - name: Checkout module
        uses: actions/checkout@v4
        with:
          repository: ${{ fromJson(steps.info.outputs.MODULE).repo }}
          ref: ${{ fromJson(steps.info.outputs.MODULE).branch }}
          path: build/${{ steps.info.outputs.DIR }}

      - name: Setup Gradle wrapper permissions
        shell: bash
        env:
          DIRECTORY: build/${{ steps.info.outputs.DIR }}
        run: chmod +x $DIRECTORY/gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Prepare gradle asset cache
        shell: bash
        run: |
          mkdir -p ~/.gradle/caches/fabric-loom/assets

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-overwrite-existing: true

      - name: Restore module jar cache
        id: module_cache
        uses: actions/cache/restore@v4
        with:
          path: build/${{ steps.info.outputs.DIR }}/build/libs/
          key: ${{ steps.info.outputs.DIR }}-${{ fromJson(steps.info.outputs.MODULE).hash }}

      - name: Build project
        if: steps.module_cache.outputs.cache-hit != 'true'
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          attempt_delay: 2000
          current_path: build/${{ steps.info.outputs.DIR }}
          command: ./gradlew runData build

      - name: Delete sources jars
        if: steps.module_cache.outputs.cache-hit != 'true'
        run: rm build/${{ steps.info.outputs.DIR }}/build/libs/*-sources.jar

      - name: Save module jar to cache
        if: steps.module_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/${{ steps.info.outputs.DIR }}/build/libs/
          key: ${{ steps.info.outputs.DIR }}-${{ fromJson(steps.info.outputs.MODULE).hash }}

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.DIR }}-jar
          path: build/${{ steps.info.outputs.DIR }}/build/libs/*.jar

      - name: Mark Resources Outdated
        if: failure()
        shell: bash
        run: |
          mkdir -p output/resources/${{ steps.info.outputs.DIR }}
          echo ${{ fromJson(steps.info.outputs.MODULE).hash }} > output/resources/${{ steps.info.outputs.DIR }}/.outdated

      - name: Rsync data and resources
        if: success()
        uses: up9cloud/action-rsync@v1.4
        env:
          MODE: local
          SOURCE: "build/${{ steps.info.outputs.DIR }}/src/main/resources/ build/${{ steps.info.outputs.DIR }}/src/generated/resources/"
          TARGET: output/resources/${{ steps.info.outputs.DIR }}
          VERBOSE: true
          ARGS_MORE: "--exclude=**/.cache/** --exclude=*.cache"
          PRE_SCRIPT: |
            rm -rf output/resources/${{ steps.info.outputs.DIR }}
            echo start at:
            date -u
          POST_SCRIPT: "echo done at: && date -u"

      - name: Create Patch and Commit Message if changed
        shell: bash
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          COMMIT_MSG="feat: update ${{ steps.info.outputs.DIR }} to ${{ fromJson(steps.info.outputs.MODULE).hash }}"
          git diff --binary --full-index --no-relative -- \
            . \
            ':!**/*.cache*' \
            > build/${{ steps.info.outputs.DIR }}.patch || true
          PATCH_SIZE=$(stat -c%s "build/${{ steps.info.outputs.DIR }}.patch" || echo 0)
          if [[ "$PATCH_SIZE" -eq "0" ]]; then
            echo "No changes to save as patch."
            rm build/${{ steps.info.outputs.DIR }}.patch
          else
            echo "$COMMIT_MSG" > build/${{ steps.info.outputs.DIR }}.msg
          fi

      - name: Upload patch artifact (if exists)
        if: exists('build/${{ steps.info.outputs.DIR }}.patch')
        uses: actions/upload-artifact@v4
        with:
          name: patch-${{ steps.info.outputs.DIR }}
          path: |
            build/${{ steps.info.outputs.DIR }}.patch
            build/${{ steps.info.outputs.DIR }}.msg

  apply-patches:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-create patch folder
        run: mkdir -p build/patches

      - name: Download all patch artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/patches
          pattern: patch-*

      - name: List patches
        id: list_patches
        run: |
          find build/patches -name "*.patch" -type f | sort > build/patches/patch_list.txt

      - name: Apply patches and commit individually
        run: |
          set -e
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          PATCH_COUNT=0
          while IFS= read -r patchfile; do
            if [ ! -s "$patchfile" ]; then continue; fi
            msgfile="${patchfile%.patch}.msg"
            if [ ! -s "$msgfile" ]; then
              echo "Patch $patchfile missing message file $msgfile, skipping."
              continue
            fi
            echo "Applying $patchfile"
            git apply --index --whitespace=nowarn "$patchfile"
            git add -A
            COMMIT_MSG=$(cat "$msgfile")
            git commit -m "$COMMIT_MSG"
            PATCH_COUNT=$((PATCH_COUNT+1))
          done < build/patches/patch_list.txt
          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "No patches to commit."
            exit 0
          fi
          git pull --rebase
          git push

  run-and-export:
    runs-on: ubuntu-latest
    needs: [build-doc-exporter, apply-patches]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mods folder
        run: mkdir -p run/mods

      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          path: run/mods
          pattern: '*-jar'
          merge-multiple: true

      - name: Remove sources files
        run: rm run/mods/*-sources.jar

      - name: Compute release hash
        id: release_hash
        shell: bash
        run: |
          echo "hash=$(git rev-parse --short HEAD || true)" >> "$GITHUB_OUTPUT"
      - name: Publish Jars
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_hash.outputs.hash }}
          files: |
            run/mods/*

      - name: Download dependencies
        run: |
          cd run/mods
          cat ../../dependencies.json | jq -r 'keys[] as $key | .[$key]' | while read -r dependency; do curl -LO "$dependency"; done
          rm *-sources.jar

      - name: Remove old wiki output
        run: rm -rf output/wiki/*

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Export docs using headless client
        uses: headlesshq/mc-runtime-test@3.0.0
        with:
          mc: 1.21.1
          modloader: neoforge
          regex: .*neoforge.*
          mc-runtime-test: neoforge
          java: ${{ env.JAVA_VERSION }}
          xvfb: false

      - name: Commit and push updated runtime resources
        uses: Jarva/git-commit-push@main
        with:
          pull: true
          commit_message: "feat: update runtime resources"

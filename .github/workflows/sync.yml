name: Sync Latest Changes

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/**'
  schedule:
    - cron: "0 0 * * *"

env:
  JAVA_VERSION: 21

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ["1.21"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
    - name: Sync Projects
      run: |
        ./scripts/sync.sh
    - uses: Jarva/git-commit-push@main
      with:
        pull: true
        commit_message: "ci: bump versions"

name: Sync Latest Changes

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/**'
  schedule:
    - cron: "0 0 * * *"

env:
  JAVA_VERSION: 21

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ["1.21"]
    outputs:
      changes_committed: ${{ steps.detect_commit.outputs.changed }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
    - name: Sync Projects
      run: |
        ./scripts/sync.sh
    - uses: GuillaumeFalourd/git-commit-push@v1.3
      with:
        commit_message: "ci: bump versions"
    - name: Detect new commit
      id: detect_commit
      run: |
        post=$(git rev-parse HEAD)
        if [ "$post" != "${{ github.sha }}" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: sync
    if: needs.sync.outputs.changes_committed == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
